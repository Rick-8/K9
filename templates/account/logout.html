{% extends 'base.html' %}

{% block title %}Sign Out | K9 Project{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5 text-center">
        <div class="card shadow-sm border-0 p-4">
            <h1 class="h3 fw-bold text-dark mb-3">Sign Out</h1>
            <p class="text-muted mb-4">Are you sure you want to sign out of your account?</p>
            <form method="POST" action="{% url 'account_logout' %}">
                {% csrf_token %}
                <div class="d-grid gap-2">
                    <button class="btn btn-dark btn-lg" type="submit">Confirm Sign Out</button>
                    <a href="{% url 'home' %}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
