{% extends 'base.html' %}

{% block title %}Register | K9 Project{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 p-4">
            <h1 class="h3 fw-bold text-dark text-center mb-4">Create an Account</h1>
            <form method="POST" action="{% url 'account_signup' %}">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="d-grid gap-2 mt-4">
                    <button class="btn btn-dark btn-lg" type="submit">Register</button>
                </div>
            </form>
            <p class="text-center text-muted mt-3 mb-0">
                Already have an account? <a href="{% url 'account_login' %}" class="text-dark fw-bold">Sign In</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
